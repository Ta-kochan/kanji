<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語名 → 漢字 コンバーター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e0e0e0;
    }

    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #e879f9, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 40px;
    }

    .input-area {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: #818cf8; }
    input[type="text"]::placeholder { color: #64748b; }

    .mic-btn {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #e879f9, #818cf8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(129,140,248,0.3);
    }

    .mic-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(129,140,248,0.5); }
    .mic-btn.recording { animation: pulse 1s infinite; background: linear-gradient(135deg, #f43f5e, #ec4899); }

    @keyframes pulse {
      0%,100% { transform: scale(1); box-shadow: 0 4px 15px rgba(244,63,94,0.4); }
      50% { transform: scale(1.12); box-shadow: 0 8px 25px rgba(244,63,94,0.7); }
    }

    .mic-btn svg { width: 22px; height: 22px; fill: white; }

    .convert-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #818cf8, #e879f9);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-bottom: 12px;
    }

    .convert-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .convert-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      min-height: 20px;
      margin-bottom: 24px;
    }
    .status.error { color: #f87171; }
    .status.listening { color: #a78bfa; }

    .result-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(129,140,248,0.3);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      display: none;
      animation: fadeIn 0.4s ease;
    }
    .result-card.visible { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-input-name { color: #64748b; font-size: 0.85rem; margin-bottom: 16px; }

    .kanji-display {
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(90deg, #e879f9, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 10px;
      letter-spacing: 0.1em;
    }

    .reading { font-size: 1.1rem; color: #a78bfa; margin-bottom: 20px; letter-spacing: 0.15em; }

    .explanation {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.7;
      text-align: left;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      padding: 16px;
    }

    .speech-unsupported { display: none; text-align: center; font-size: 0.8rem; color: #f87171; margin-bottom: 8px; }

    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>英語名 → 漢字</h1>
    <p class="subtitle">英語の名前を入力またはマイクで話しかけると漢字に変換します</p>

    <p class="speech-unsupported" id="speechUnsupported">
      ※ このブラウザは音声入力に対応していません。テキスト入力をご利用ください。
    </p>

    <div class="input-area">
      <input type="text" id="nameInput" placeholder="例: Michael, Sarah, William..."
        autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="mic-btn" id="micBtn" title="音声入力">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
    </div>

    <button class="convert-btn" id="convertBtn" disabled>漢字に変換する</button>
    <p class="status" id="status"></p>

    <div class="result-card" id="resultCard">
      <p class="result-input-name" id="resultInputName"></p>
      <div class="kanji-display" id="kanjiDisplay"></div>
      <div class="reading" id="readingDisplay"></div>
      <div class="explanation" id="explanationDisplay"></div>
    </div>
  </div>

  <script>
    const nameInput = document.getElementById('nameInput');
    const micBtn = document.getElementById('micBtn');
    const convertBtn = document.getElementById('convertBtn');
    const status = document.getElementById('status');
    const resultCard = document.getElementById('resultCard');
    const kanjiDisplay = document.getElementById('kanjiDisplay');
    const readingDisplay = document.getElementById('readingDisplay');
    const explanationDisplay = document.getElementById('explanationDisplay');
    const resultInputName = document.getElementById('resultInputName');
    const speechUnsupported = document.getElementById('speechUnsupported');

    let recognition = null;
    let isRecording = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      speechUnsupported.style.display = 'block';
      micBtn.disabled = true;
      micBtn.style.opacity = '0.3';
      micBtn.style.cursor = 'not-allowed';
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        setStatus('listening', '🎤 聞いています... 名前を話してください');
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        nameInput.value = transcript;
        updateConvertBtn();
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        setStatus('', '');
      };

      recognition.onerror = (event) => {
        isRecording = false;
        micBtn.classList.remove('recording');
        if (event.error === 'no-speech') {
          setStatus('error', '音声が検出されませんでした。もう一度お試しください。');
        } else if (event.error !== 'aborted') {
          setStatus('error', `音声認識エラー: ${event.error}`);
        }
      };
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) return;
      if (isRecording) { recognition.stop(); }
      else {
        nameInput.value = '';
        updateConvertBtn();
        recognition.start();
      }
    });

    nameInput.addEventListener('input', updateConvertBtn);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !convertBtn.disabled) convert();
    });

    function updateConvertBtn() {
      convertBtn.disabled = nameInput.value.trim().length === 0;
    }

    function setStatus(type, message) {
      status.textContent = message;
      status.className = 'status' + (type ? ` ${type}` : '');
    }

    convertBtn.addEventListener('click', convert);

    async function convert() {
      const name = nameInput.value.trim();
      if (!name) return;

      convertBtn.disabled = true;
      if (isRecording) recognition?.stop();
      setStatus('', '');
      resultCard.classList.remove('visible');
      convertBtn.innerHTML = '<span class="loading-dots">変換中</span>';

      try {
        const res = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '変換に失敗しました。');

        resultInputName.textContent = `"${name}" の漢字表記`;
        kanjiDisplay.textContent = data.kanji;
        readingDisplay.textContent = data.reading;
        explanationDisplay.textContent = data.explanation;
        resultCard.classList.add('visible');
      } catch (err) {
        setStatus('error', err.message || 'エラーが発生しました。');
      } finally {
        convertBtn.innerHTML = '漢字に変換する';
        convertBtn.disabled = nameInput.value.trim().length === 0;
      }
    }
  </script>
</body>
</html>
