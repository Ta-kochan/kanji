<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名前漢字メーカー</title>
  <meta name="description" content="英語の名前を話しかけると、意味のある漢字に変換してハンコ風に表示するアプリ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Poppins:wght@600;800&family=Yuji+Syuku&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #1a0b2e;
      --bg-1: #2d1245;
      --bg-2: #0f3460;
      --pink: #ff6ec7;
      --magenta: #e879f9;
      --violet: #818cf8;
      --gold: #ffd36e;
      --vermillion: #e8321e;
      --vermillion-deep: #c41e0f;
      --text: #f4ecff;
      --muted: #b7a9d0;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Zen Maru Gothic', 'Poppins', 'Hiragino Sans', sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
      background-size: 200% 200%;
      animation: bgShift 18s ease infinite;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes bgShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* ===== Floating background kanji ===== */
    .bg-kanji {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .bg-kanji span {
      position: absolute;
      font-family: 'Yuji Syuku', serif;
      color: rgba(255, 255, 255, 0.035);
      font-weight: 900;
      user-select: none;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(20vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-120vh) rotate(25deg); opacity: 0; }
    }

    /* ===== Sakura petals ===== */
    .petal {
      position: fixed;
      top: -10vh;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 30% 30%, #ffd6ec, #ff9ed2);
      border-radius: 150% 0 150% 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.8;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateX(0) translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.85; }
      100% { transform: translateX(16vw) translateY(110vh) rotate(540deg); opacity: 0; }
    }

    /* ===== Card ===== */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 540px;
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 40px 32px 36px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--gold);
      background: rgba(255, 211, 110, 0.12);
      border: 1px solid rgba(255, 211, 110, 0.3);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
      background: linear-gradient(100deg, var(--gold), var(--pink) 40%, var(--magenta) 65%, var(--violet));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }

    .subtitle {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .speech-unsupported {
      display: none;
      font-size: 0.78rem;
      color: #ffb4b4;
      background: rgba(255, 90, 90, 0.1);
      border: 1px solid rgba(255, 90, 90, 0.25);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
    }

    .input-area {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 16px 18px;
      background: rgba(0, 0, 0, 0.25);
      border: 1.5px solid var(--glass-border);
      border-radius: 14px;
      color: #fff;
      font-size: 1.05rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--magenta);
      box-shadow: 0 0 0 4px rgba(232, 121, 249, 0.18);
    }
    input[type="text"]::placeholder { color: #8a7ba8; }

    .mic-btn {
      position: relative;
      width: 56px; height: 56px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--magenta), var(--violet));
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 6px 18px rgba(129, 140, 248, 0.4);
    }
    .mic-btn:hover { transform: scale(1.08); }
    .mic-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .mic-btn svg { width: 24px; height: 24px; fill: #fff; z-index: 2; }

    .mic-btn.recording {
      background: linear-gradient(135deg, var(--vermillion), #ff5e8a);
    }
    .mic-btn.recording::before,
    .mic-btn.recording::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 94, 138, 0.7);
      animation: ripple 1.5s ease-out infinite;
    }
    .mic-btn.recording::after { animation-delay: 0.6s; }
    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.1); opacity: 0; }
    }

    .convert-btn {
      position: relative;
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      font-size: 1.08rem;
      font-weight: 700;
      font-family: inherit;
      color: #fff;
      cursor: pointer;
      overflow: hidden;
      background: linear-gradient(100deg, var(--violet), var(--magenta) 50%, var(--pink));
      background-size: 200% auto;
      box-shadow: 0 10px 28px rgba(232, 121, 249, 0.35);
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    }
    .convert-btn:hover:not(:disabled) { transform: translateY(-2px); background-position: right center; box-shadow: 0 14px 34px rgba(232, 121, 249, 0.5); }
    .convert-btn:active:not(:disabled) { transform: translateY(0); }
    .convert-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .convert-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -120%;
      width: 60%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: skewX(-20deg);
    }
    .convert-btn:hover:not(:disabled)::after { animation: sweep 0.8s ease; }
    @keyframes sweep { to { left: 160%; } }

    .status {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 22px;
      margin-top: 16px;
    }
    .status.error { color: #ff9b9b; }
    .status.listening { color: var(--pink); }

    /* ===== Result (Hanko stamp) ===== */
    .result {
      margin-top: 28px;
      display: none;
      text-align: center;
    }
    .result.visible { display: block; }

    .result-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .result-label b { color: var(--text); }

    .hanko {
      --size: 180px;
      width: var(--size);
      height: var(--size);
      margin: 0 auto 10px;
      border-radius: 50%;
      border: 7px solid var(--vermillion);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: var(--vermillion);
      background:
        radial-gradient(circle at 50% 50%, rgba(232, 50, 30, 0.08), transparent 70%);
      box-shadow: 0 0 0 2px rgba(232, 50, 30, 0.15), 0 14px 40px rgba(232, 50, 30, 0.25);
    }
    .result.visible .hanko { animation: stampPress 0.55s cubic-bezier(.18,1.4,.4,1) both; }
    @keyframes stampPress {
      0% { transform: scale(2.4) rotate(-14deg); opacity: 0; filter: blur(4px); }
      55% { transform: scale(0.9) rotate(3deg); opacity: 1; filter: blur(0); }
      75% { transform: scale(1.05) rotate(-1deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .hanko .kanji {
      font-family: 'Yuji Syuku', 'Zen Maru Gothic', serif;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0.02em;
      /* ink texture via subtle gradient */
      background: linear-gradient(135deg, var(--vermillion-deep), var(--vermillion));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      padding: 0 6px;
    }
    /* font size adapts to length via JS classes */
    .hanko .kanji.len-1 { font-size: 5.2rem; }
    .hanko .kanji.len-2 { font-size: 4rem; }
    .hanko .kanji.len-3 { font-size: 2.9rem; }
    .hanko .kanji.len-4 { font-size: 2.3rem; }
    .hanko .kanji.len-long { font-size: 1.7rem; writing-mode: horizontal-tb; }

    .reading {
      font-size: 1.15rem;
      color: var(--gold);
      letter-spacing: 0.2em;
      font-weight: 700;
      margin: 6px 0 20px;
    }
    .result.visible .reading { animation: fadeUp 0.5s 0.35s both; }

    .explanation {
      font-size: 0.92rem;
      line-height: 1.75;
      color: #d8ccf0;
      text-align: left;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .result.visible .explanation { animation: fadeUp 0.5s 0.45s both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .copy-btn:hover { background: rgba(255, 255, 255, 0.16); transform: translateY(-1px); }
    .copy-btn.copied { color: var(--gold); border-color: rgba(255, 211, 110, 0.4); }

    .footer {
      text-align: center;
      font-size: 0.72rem;
      color: #7d6f9c;
      margin-top: 26px;
    }

    /* Sparkles burst */
    .spark {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }
    @keyframes sparkFly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; } 25% { content: '・'; } 50% { content: '・・'; }
      75% { content: '・・・'; } 100% { content: ''; }
    }

    @media (max-width: 480px) {
      .container { padding: 32px 22px 30px; }
      h1 { font-size: 1.7rem; }
      .hanko { --size: 160px; }
    }
  </style>
</head>
<body>
  <div class="bg-kanji" id="bgKanji" aria-hidden="true"></div>

  <div class="container">
    <span class="badge">✦ NAME KANJI MAKER</span>
    <h1>名前漢字メーカー</h1>
    <p class="subtitle">英語の名前を <b style="color:var(--text)">マイク🎤</b> で話すか入力すると、<br>響きと意味に合った漢字をハンコ風にお届けします。</p>

    <p class="speech-unsupported" id="speechUnsupported">
      ※ このブラウザは音声入力に対応していません。テキスト入力をご利用ください。
    </p>

    <div class="input-area">
      <input type="text" id="nameInput" placeholder="例: Michael, Sarah, William..."
        autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="mic-btn" id="micBtn" title="音声入力" aria-label="音声入力">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm6-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
    </div>

    <button class="convert-btn" id="convertBtn" disabled>漢字に変換する</button>

    <p class="status" id="status"></p>

    <div class="result" id="result">
      <p class="result-label" id="resultLabel"></p>
      <div class="hanko" id="hanko">
        <span class="kanji" id="kanjiDisplay"></span>
      </div>
      <div class="reading" id="readingDisplay"></div>
      <div class="explanation" id="explanationDisplay"></div>
      <button class="copy-btn" id="copyBtn">漢字をコピー</button>
    </div>

    <p class="footer">Powered by Claude · あなたの名前に、物語を。</p>
  </div>

  <script>
    // ===== Background floating kanji =====
    (function () {
      const pool = '愛勇夢光希星空海月花風雅誠心翔輝彩和真優';
      const host = document.getElementById('bgKanji');
      for (let i = 0; i < 14; i++) {
        const s = document.createElement('span');
        s.textContent = pool[Math.floor(Math.random() * pool.length)];
        s.style.left = Math.random() * 100 + 'vw';
        s.style.fontSize = (40 + Math.random() * 90) + 'px';
        const dur = 16 + Math.random() * 18;
        s.style.animationDuration = dur + 's';
        s.style.animationDelay = -Math.random() * dur + 's';
        host.appendChild(s);
      }
    })();

    // ===== Sakura petals =====
    (function () {
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'petal';
        p.style.left = Math.random() * 100 + 'vw';
        const dur = 7 + Math.random() * 8;
        p.style.animationDuration = dur + 's';
        p.style.animationDelay = -Math.random() * dur + 's';
        const scale = 0.6 + Math.random() * 0.9;
        p.style.transform = `scale(${scale})`;
        document.body.appendChild(p);
      }
    })();

    // ===== Elements =====
    const nameInput = document.getElementById('nameInput');
    const micBtn = document.getElementById('micBtn');
    const convertBtn = document.getElementById('convertBtn');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const hanko = document.getElementById('hanko');
    const kanjiDisplay = document.getElementById('kanjiDisplay');
    const readingDisplay = document.getElementById('readingDisplay');
    const explanationDisplay = document.getElementById('explanationDisplay');
    const resultLabel = document.getElementById('resultLabel');
    const copyBtn = document.getElementById('copyBtn');
    const speechUnsupported = document.getElementById('speechUnsupported');

    let recognition = null;
    let isRecording = false;

    // ===== Web Speech API =====
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      speechUnsupported.style.display = 'block';
      micBtn.disabled = true;
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        setStatus('listening', '🎤 聞いています… 名前を話してください');
      };
      recognition.onresult = (e) => {
        let t = '';
        for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
        nameInput.value = t;
        updateConvertBtn();
      };
      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        if (nameInput.value.trim()) setStatus('', '');
        else setStatus('', '');
      };
      recognition.onerror = (e) => {
        isRecording = false;
        micBtn.classList.remove('recording');
        if (e.error === 'no-speech') setStatus('error', '音声が検出されませんでした。もう一度お試しください。');
        else if (e.error === 'not-allowed') setStatus('error', 'マイクの使用が許可されていません。ブラウザの設定を確認してください。');
        else if (e.error !== 'aborted') setStatus('error', `音声認識エラー: ${e.error}`);
      };
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) return;
      if (isRecording) recognition.stop();
      else { nameInput.value = ''; updateConvertBtn(); recognition.start(); }
    });

    nameInput.addEventListener('input', updateConvertBtn);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !convertBtn.disabled) convert();
    });

    function updateConvertBtn() { convertBtn.disabled = nameInput.value.trim().length === 0; }
    function setStatus(type, msg) { status.textContent = msg; status.className = 'status' + (type ? ' ' + type : ''); }

    convertBtn.addEventListener('click', convert);

    function sizeClass(str) {
      const n = [...str].length;
      if (n <= 1) return 'len-1';
      if (n === 2) return 'len-2';
      if (n === 3) return 'len-3';
      if (n === 4) return 'len-4';
      return 'len-long';
    }

    function burstSparkles() {
      const rect = hanko.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const colors = ['#ffd36e', '#ff6ec7', '#e879f9', '#818cf8', '#ffffff'];
      for (let i = 0; i < 24; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = cx + 'px';
        s.style.top = cy + 'px';
        s.style.background = colors[i % colors.length];
        const ang = (Math.PI * 2 * i) / 24;
        const dist = 80 + Math.random() * 90;
        s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
        s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
        s.style.animation = `sparkFly ${0.6 + Math.random() * 0.4}s ease-out forwards`;
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1100);
      }
    }

    async function convert() {
      const name = nameInput.value.trim();
      if (!name) return;

      convertBtn.disabled = true;
      if (isRecording) recognition?.stop();
      setStatus('', '');
      result.classList.remove('visible');
      convertBtn.innerHTML = '<span class="loading-dots">変換中</span>';

      try {
        const res = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '変換に失敗しました。');

        resultLabel.innerHTML = `<b>"${name}"</b> の漢字表記`;
        kanjiDisplay.textContent = data.kanji;
        kanjiDisplay.className = 'kanji ' + sizeClass(data.kanji);
        readingDisplay.textContent = data.reading;
        explanationDisplay.textContent = data.explanation;

        // retrigger stamp animation
        result.classList.remove('visible');
        void result.offsetWidth;
        result.classList.add('visible');

        copyBtn.textContent = '漢字をコピー';
        copyBtn.classList.remove('copied');

        setTimeout(burstSparkles, 400);
        result.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (err) {
        setStatus('error', err.message || 'エラーが発生しました。サーバーが起動しているか確認してください。');
      } finally {
        convertBtn.innerHTML = '漢字に変換する';
        convertBtn.disabled = nameInput.value.trim().length === 0;
      }
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(kanjiDisplay.textContent);
        copyBtn.textContent = '✓ コピーしました';
        copyBtn.classList.add('copied');
      } catch {
        copyBtn.textContent = 'コピーできませんでした';
      }
    });
  </script>
</body>
</html>
